<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenBoost UI - Script Loading Reference</title>
    
    <!-- ===============================================
         CSS FILES - Can go in head or before closing body
         =============================================== -->
    
    <!-- DataTables CSS -->
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css">
    
    <!-- Select2 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css">
    
    <!-- Choices.js CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/choices.js@10.2.0/public/assets/styles/choices.min.css">
    
    <!-- Flatpickr CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    
    <!-- Quill CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/quill@2.0.0/dist/quill.snow.css">
    
    <!-- SimpleMDE CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/simplemde@1.11.2/dist/simplemde.min.css">
    
    <!-- Trix CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/trix@1.3.1/dist/trix.css">
    
    <!-- jsTree CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/jstree/3.3.15/themes/default/style.min.css">
    
    <!-- OpenBoost CSS -->
    <link rel="stylesheet" href="/resources/css/open-boost.css">
</head>
<body>
    <!-- Your page content goes here -->
    
    <!-- ===============================================
         JAVASCRIPT FILES - MUST BE IN THIS ORDER
         =============================================== -->
    
    <!-- STEP 1: jQuery Loader (detects and exposes jQuery) -->
    <script src="/resources/js/jquery-loader.js"></script>
    
    <!-- STEP 2: jQuery (core library) -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    
    <!-- STEP 3: jQuery Plugins (depend on jQuery from step 2) -->
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jstree/3.3.15/jstree.min.js"></script>
    <!-- Add form-wizard-numbered.js, form-wizard-validation.js, extended-ui-treeview.js if needed -->
    
    <!-- STEP 4: Other JavaScript Libraries (mostly standalone) -->
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/choices.js@10.2.0/public/assets/scripts/choices.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/apexcharts@3.41.0/dist/apexcharts.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/quill@2.0.0/dist/quill.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/simplemde@1.11.2/dist/simplemde.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/trix@1.3.1/dist/trix.umd.js"></script>
    
    <!-- STEP 5: OpenBoost Initialization (MUST be last) -->
    <script src="/resources/js/open-boost-init.js"></script>
    
    <!-- Optional: Include diagnostics script for troubleshooting -->
    <script src="/resources/js/open-boost-diagnostics.js"></script>

    <script>
        // Optional: Run diagnostics manually if needed
        // OpenBoostDiagnostics.runAll();
    </script>
</body>
</html>
